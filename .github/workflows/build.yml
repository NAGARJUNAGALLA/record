name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Modules
        run: npm install

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Fix JitPack Dependency Resolution
        run: |
          # 1. Add JitPack globally to the main Android project
          sed -i "s/mavenCentral()/mavenCentral()\n        maven { url 'https:\/\/jitpack.io' }/g" android/build.gradle
          # 2. Fix the broken www. URL inside the screen recorder node module
          sed -i 's/www.jitpack.io/jitpack.io/g' node_modules/react-native-record-screen/android/build.gradle || true

      - name: Build APK (Assemble Release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
