name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Modules
        run: npm install

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Global Fix for HBRecorder and JitPack
        run: |
          # 1. Search every gradle file in node_modules and fix the HBISoft case-sensitivity typo
          find node_modules -type f -name "*.gradle" -exec sed -i 's/HBISoft/HBiSoft/g' {} +
          
          # 2. Search every gradle file and fix the broken www.jitpack.io URLs
          find node_modules -type f -name "*.gradle" -exec sed -i 's/www.jitpack.io/jitpack.io/g' {} +
          find android -type f -name "*.gradle" -exec sed -i 's/www.jitpack.io/jitpack.io/g' {} +
          
          # 3. Ensure standard jitpack is injected into the root Android repositories
          sed -i "s/mavenCentral()/mavenCentral()\n        maven { url 'https:\/\/jitpack.io' }/g" android/build.gradle || true

      - name: Build APK (Assemble Release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
