name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Modules
        run: npm install

      - name: Patch Node Modules (Before Prebuild)
        run: |
          # Fix the case-sensitivity typo BEFORE Gradle is ever launched
          find node_modules/react-native-record-screen -type f -name "*.gradle" -exec sed -i 's/HBISoft/HBiSoft/g' {} +
          # Fix the broken URL scheme
          find node_modules/react-native-record-screen -type f -name "*.gradle" -exec sed -i 's/www.jitpack.io/jitpack.io/g' {} +

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Inject JitPack Repository
        run: |
          # Inject JitPack into the newly generated Android folder
          sed -i "s/mavenCentral()/mavenCentral()\n        maven { url 'https:\/\/jitpack.io' }/g" android/build.gradle

      - name: Build APK (Assemble Release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
