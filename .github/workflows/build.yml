name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Modules
        run: npm install

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Inject JitPack Safely
        run: |
          node -e "
          const fs = require('fs');
          const file = 'android/build.gradle';
          let code = fs.readFileSync(file, 'utf8');
          // Safely target ONLY the allprojects repositories block
          code = code.replace(/allprojects\s*\{\s*repositories\s*\{/, \"allprojects {\\n    repositories {\\n        maven { url 'https://jitpack.io' }\");
          fs.writeFileSync(file, code);
          "

      - name: Build APK (Assemble Release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
