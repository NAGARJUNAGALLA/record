name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Changed to v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Changed to v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4 # Changed to v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Node Modules
        run: npm install

      - name: Generate Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build APK (Assemble Release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4 # Changed to v4 to fix the error
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
